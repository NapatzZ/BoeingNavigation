services:
  skuba-nav-poc:
    build:
      context: .
      dockerfile: docker/Dockerfile.poc
    image: skuba-navigation-poc:humble
    container_name: skuba_nav_poc
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      # Mount dependencies from host (absolute paths)
      - /Users/nimbuss/skuba_bringup:/ros_ws/src/skuba_bringup
      - /Users/nimbuss/skuba_interfaces:/ros_ws/src/skuba_interfaces
      - /Users/nimbuss/skuba_description:/ros_ws/src/skuba_description
      # Mount this repo
      - /Users/nimbuss/Documents/skuba_navigation:/ros_ws/src/skuba_navigation
      # Hardware access
      - /dev:/dev
      - /run/udev:/run/udev:ro
      # Build cache volumes
      - nav_ws_build:/ros_ws/build
      - nav_ws_install:/ros_ws/install
      # Entrypoint
      - ./docker/entrypoint.poc.sh:/entrypoint.sh:ro
    working_dir: /ros_ws
    environment:
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: "67"
    stdin_open: true
    tty: true
    command: bash
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

volumes:
  nav_ws_build:
  nav_ws_install: