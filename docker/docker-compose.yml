services:
  nav:
    image: registry.gitlab.com/robotcitizens/skuba/robocup-opl/skuba-ahr/software-team/skuba_navigation:latest
    build:
      context: .
      dockerfile: dockerfile
    container_name: skuba-nav
    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        - test -f /ros_ws/install/setup.bash && source /opt/ros/humble/setup.bash && timeout 5 ros2 node list > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 600s
    privileged: true
    network_mode: host
    ipc: host
    init: true
    environment:
      - ROS_DOMAIN_ID=67
      - FOXGLOVE=${FOXGLOVE:-0} 
      - DISPLAY=:1
      - XAUTHORITY=
    devices:
      - /dev/bus/usb
    volumes:
      - /dev:/dev
      - ../.:/ros_ws/src/skuba_navigation
      - ${PKG_BRINGUP:-../../skuba_bringup}:/ros_ws/src/skuba_bringup
      - ${PKG_INTERFACES:-../../skuba_interfaces}:/ros_ws/src/skuba_interfaces
      - ${PKG_DESCRIPTION:-../../skuba_description}:/ros_ws/src/skuba_description
      - type: tmpfs
        target: /ros_ws/src/skuba_bringup/drivers
      - ${PKG_BRINGUP:-../../skuba_bringup}/drivers/sllidar_ros2:/ros_ws/src/sllidar_ros2
      - nav_ws_build:/ros_ws/build
      - nav_ws_install:/ros_ws/install
      - ${SKUBA_LOG_DIR:-${HOME}/skuba/logs}/nav:/root/.ros/log
      - ./entrypoint.sh:/entrypoint_override.sh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    entrypoint: ["/bin/bash", "/entrypoint_override.sh"]
    command: ["sleep", "infinity"]
    deploy:
      resources:
        limits:
          memory: 12G
    stdin_open: true
    tty: true
volumes:
  nav_ws_build:
    labels: {skuba.module: nav}
  nav_ws_install:
    labels: {skuba.module: nav}
