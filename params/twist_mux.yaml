# twist_mux — arbitrates several cmd_vel sources into a single /cmd_vel.
#
# Each source publishes to its OWN topic; twist_mux forwards the highest-priority
# active one to /cmd_vel (the topic the kobuki base subscribes to). A source is
# "active" while it keeps publishing within its `timeout`; when it goes silent it
# drops out and the next-highest source takes over.
#
#   source     input topic      priority   notes
#   ────────   ──────────────   ────────   ───────────────────────────────────
#   joystick   cmd_vel_joy          100    teleop_twist_joy (xbox) — human override
#   keyboard   cmd_vel_key           90    teleop_twist_keyboard
#   nav2       cmd_vel_nav           10    collision_monitor cmd_vel_out_topic
#   nav manual cmd_vel_nav_manual    10    navigation_server: rotate/drive_straight/nudge_to_frame
#
# cmd_vel_nav and cmd_vel_nav_manual share priority 10 deliberately: both are
# navigation_server's own output, and its GoalArbiter lets only one goal
# drive at a time (a NavigateToPose goal XOR a rotate/drive/nudge action), so
# there is no real arbitration between them — the split exists only so
# navigation_server's raw point-turn/straight-line commands (which bypass Nav2's
# planner and therefore collision_monitor's safety filter entirely) never
# share a topic with collision_monitor's own filtered output. Two publishers
# on the same topic would otherwise race.
#
# There is no dedicated "follower" lane: following_server.py drives person
# tracking through Nav2's NavigateToPose action (GoalUpdater pattern), so its
# output already lands on cmd_vel_nav via collision_monitor like any other
# Nav2 goal — it does not publish cmd_vel directly.
#
# The e_stop LOCK (std_msgs/Bool) sits above everything: while it publishes
# `true`, twist_mux blocks every input (priority < 255) and the base receives no
# command → the robot stops. timeout: 0.0 disables lock expiry so the lock state
# is driven purely by the Bool value (emergency_stop.py publishes the live button
# level: True while pressed, False once released).
twist_mux:
  ros__parameters:
    use_sim_time: false

    topics:
      joystick:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 100
      keyboard:
        topic: cmd_vel_key
        timeout: 0.5
        priority: 90
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
      navigation_manual:
        topic: cmd_vel_nav_manual
        timeout: 0.5
        priority: 10

    locks:
      e_stop:
        topic: e_stop
        timeout: 0.0
        priority: 255
