# ==============================================================================
# Controller Server — RotationShim + RegulatedPurePursuit (from rcj_param.yaml)
# ==============================================================================
# Using singular progress_checker_plugin (Humble API).
# Iron+ renamed this to progress_checker_plugins (vector) — DO NOT use plural on Humble.
# ==============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false  # rewritten to true by nav2_bringup under simulation
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.35

    FollowPath:
      # RotationShim wraps RPP and handles initial heading alignment
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.50
      forward_sampling_distance: 0.60
      rotate_to_heading_angular_vel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      rotate_to_heading_once: false

      # Regulated Pure Pursuit
      desired_linear_vel: 0.4
      # Short: a long carrot cuts the corner of a door frame (carrying a bag
      # out in front, that is a collision).
      lookahead_dist: 0.45
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.6
      lookahead_time: 1.0
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.85
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.5
      max_robot_pose_search_dist: 10.0


# ==============================================================================
# Local Costmap — STVL (Spatio-Temporal Voxel Layer)
# ==============================================================================
# WHY STVL instead of ObstacleLayer + DenoiseLayer:
#   ObstacleLayer: binary mark/clear — relies on raytrace hitting exact cell.
#   STVL: per-voxel decay timer + frustum-based clearing.
#     → Static obstacles (walls, furniture): re-observed every scan → timer
#       resets constantly → never expire.
#     → Dynamic obstacles (people): observed briefly then gone → cleared
#       within voxel_decay seconds automatically.
#     → No raytrace geometry failures → no permanent ghost obstacles.
#
# Dimensions and frequencies match rcj_param.yaml (5×5m, 5 Hz); the footprint
# here is a 0.207 m circle, as in rcj_param.yaml (the base + 3 cm).
#
# point_cloud_sensor source requires a depth camera publishing PointCloud2.
# If no depth camera is available, remove point_cloud_sensor from
# observation_sources and delete the point_cloud_sensor block below.
# ==============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # A 0.207 m circle as a 16-sided polygon (no robot_radius) -- the base's
      # 0.177 m radius (skuba_description base_link) + 3 cm -- so the costmap
      # runs in polygon mode and skuba_manipulation's arm_footprint can grow it
      # on <costmap>/footprint. Keep equal to the global_costmap footprint.
      footprint: "[[0.207, 0.0], [0.191, 0.079], [0.146, 0.146], [0.079, 0.191], [0.0, 0.207], [-0.079, 0.191], [-0.146, 0.146], [-0.191, 0.079], [-0.207, 0.0], [-0.191, -0.079], [-0.146, -0.146], [-0.079, -0.191], [0.0, -0.207], [0.079, -0.191], [0.146, -0.146], [0.191, -0.079]]"
      plugins: ["obstacle_layer", "stvl_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.35

      # --- LiDAR scan via ObstacleLayer ---
      # ObstacleLayer (unlike STVL) honors obstacle_min_range/raytrace_min_range,
      # so near-range/behind-robot returns are filtered out instead of marked.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          obstacle_min_range: 0.20
          raytrace_min_range: 0.20
          obstacle_max_range: 5.0
          raytrace_max_range: 5.5
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          inf_is_valid: false

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true

        # --- Temporal decay ---
        voxel_decay: 2.0      # seconds until unobserved voxel disappears (linear mode)
        decay_model: 0        # 0=linear, 1=exponential, 2=persistent

        # --- Voxel grid ---
        voxel_size: 0.05      # 5cm matches costmap resolution
        origin_z: 0.0
        max_obstacle_height: 2.0
        mark_threshold: 3     # require several occupied voxels in a column, not just one
        unknown_threshold: 15
        track_unknown_space: true

        # --- Layer behaviour ---
        update_footprint_enabled: true
        combination_method: 0
        obstacle_range: 3.0
        transform_tolerance: 0.2
        publish_voxel_map: true          # set false on competition day to save CPU
        mapping_mode: false
        map_save_duration: 60.0

        # LiDAR handled by obstacle_layer above; STVL only takes the depth camera.
        observation_sources: point_cloud_sensor

        # --- Depth camera source (3D obstacles: table legs, chair rungs) ---
        # Remove this block if no depth camera is present.
        # Change topic to /camera/filtered_points if YOLOv8 person filter is active.
        point_cloud_sensor:
          data_type: PointCloud2
          topic: /skuba/nav/filtered_points  # the head camera without the robot (cloud_self_filter)
          marking: true
          clearing: true
          obstacle_range: 2.5   # the floor is first in view ~1.2 m out: with 1.25 m nothing on it was marked
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          min_z: 0.05
          max_z: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          # The D415 depth stream at 640x480, from its camera_info (fx = fy = 628.94):
          # 2*atan(480 / (2*fy)) = 41.8 deg, 2*atan(640 / (2*fx)) = 53.9 deg. Not the D435's 58 x 87.
          vertical_fov_angle: 0.7291
          horizontal_fov_angle: 0.9413
          decay_acceleration: 15.0     # aggressive: person moves away → clears in ~133ms
          model_type: 0

      always_send_full_costmap: True


# ==============================================================================
# Global Costmap — Static (SLAM map) + Obstacle (LiDAR) + Inflation
# ==============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      # A 0.207 m circle as a 16-sided polygon (no robot_radius) -- the base's
      # 0.177 m radius (skuba_description base_link) + 3 cm -- so the costmap
      # runs in polygon mode and skuba_manipulation's arm_footprint can grow it
      # on <costmap>/footprint. Keep equal to the local_costmap footprint.
      footprint: "[[0.207, 0.0], [0.191, 0.079], [0.146, 0.146], [0.079, 0.191], [0.0, 0.207], [-0.079, 0.191], [-0.146, 0.146], [-0.191, 0.079], [-0.207, 0.0], [-0.191, -0.079], [-0.146, -0.146], [-0.079, -0.191], [0.0, -0.207], [0.079, -0.191], [0.146, -0.146], [0.191, -0.079]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "depth_layer", "inflation_layer"]

      # Things under the lidar (a shoe, a toy -- TEAM1-008) from the head camera
      # without the robot, 4-45 cm, kept until a ray sees past them: the lidar
      # passes over them and once under ~1.2 m they are out of view.
      # Off by default: following a person, their legs and the chairs round them
      # ring the goal and the planner finds no path. The task turns it on
      # (depth_layer.enabled) for the way back.
      depth_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False
        combination_method: 1
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        mark_threshold: 0
        unknown_threshold: 15
        observation_sources: depth
        depth:
          topic: /skuba/nav/filtered_points
          data_type: "PointCloud2"
          min_obstacle_height: 0.04
          max_obstacle_height: 0.45
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
          clearing: True
          marking: True

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 0
        observation_sources: scan
        scan:
          topic: /scan
          raytrace_min_range: 0.20
          obstacle_min_range: 0.20
          obstacle_max_range: 8.0
          raytrace_max_range: 8.5
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # A gentle slope: plans keep to the middle of a door instead of hugging
        # the frame the robot (longer than wide, carrying a bag) then catches.
        cost_scaling_factor: 1.5
        inflation_radius: 0.60

      always_send_full_costmap: True


# ==============================================================================
# Map Server
# ==============================================================================
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""


# ==============================================================================
# Map Saver
# ==============================================================================
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True


# ==============================================================================
# Planner Server — NavFn (from rcj_param.yaml)
# ==============================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.35
      use_astar: false
      allow_unknown: true


# ==============================================================================
# Smoother Server
# ==============================================================================
smoother_server:
  ros__parameters:
    use_sim_time: false  # rewritten to true by nav2_bringup under simulation
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True


# ==============================================================================
# Behavior Server (from rcj_param.yaml)
# ==============================================================================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.3
    rotational_acc_lim: 3.2


# ==============================================================================
# Waypoint Follower (from rcj_param.yaml)
# ==============================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false  # rewritten to true by nav2_bringup under simulation
    loop_rate: 5
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 10


# ==============================================================================
# Velocity Smoother — limits match RPP desired_linear_vel: 0.4 m/s
# ==============================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false  # rewritten to true by nav2_bringup under simulation
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.5, 2.5]
    min_velocity: [-0.4, -0.5, -2.5]
    max_accel: [0.5, 0.3, 3.2]
    max_decel: [-0.6, -0.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0


# ==============================================================================
# Collision Monitor — safety layer independent of Nav2 stack
# ==============================================================================
collision_monitor:
  ros__parameters:
    use_sim_time: false  # rewritten to true by nav2_bringup under simulation
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
