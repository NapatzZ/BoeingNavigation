# ==============================================================================
# follower_param.yaml -- Nav2 for following a person and bringing a bag back
# (Carry My Luggage, TEAM1-008). nav2_params.yaml plus:
#   * goal_updater_topic /skuba/nav/person_pose (skuba_vision person_pose_node);
#   * local STVL from /skuba/nav/filtered_points (cloud_self_filter: the head
#     camera without the arm and the bag it carries), out to 2.5 m;
#   * global depth_layer for small things on the floor, off until the way back;
#   * global inflation 1.5 / 0.60 and RPP lookahead 0.45 m for 0.65 m doors.
# Checked in Gazebo (apartment, actor person, bag carried by its handle).
#   ros2 launch skuba_navigation cheesecake_nav.launch.py params_file:=<share>/params/follower_param.yaml
# ==============================================================================
# ==============================================================================
# Nav2 + SLAM Toolbox Parameters — Restaurant Challenge
# RoboCup@Home 2026
# ==============================================================================
#
# BASE: rcj_param.yaml (controller, costmap frequencies, robot geometry, Humble API)
# ADDED: STVL (Spatio-Temporal Voxel Layer) alongside obstacle_layer in local
#        costmap — LiDAR still goes through obstacle_layer, STVL only takes
#        the depth camera (see local_costmap.stvl_layer below).
# SLAM: slam_toolbox in localization mode (pre-built map required)
#
# STVL's ROS package is declared in package.xml (exec_depend
# spatio_temporal_voxel_layer), so `rosdep install` pulls it in.
#
# SLAM Toolbox localization requires a serialized map (.posegraph + .data) built
# from a prior mapping session.  Set map_file_name below before launching.
# ==============================================================================


# ==============================================================================
# SLAM Toolbox — localization-only mode
# ==============================================================================
# In localization mode slam_toolbox:
#   - Loads the serialized pose-graph map at startup
#   - Publishes /map and provides map→odom TF  (no separate map_server needed
#     for the TF, but map_server is still used by the global static_layer)
#   - Does NOT add new nodes to the graph or rewrite the map
# ==============================================================================
slam_toolbox:
  ros__parameters:

    # --- Solver ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- ROS frames ---
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: false

    # LOCALIZATION MODE — set path to your serialized slam_toolbox map
    mode: localization
    map_file_name: ""            # e.g. /path/to/map (without .posegraph extension)
    map_start_at_dock: true      # use false and set map_start_pose if dock != origin

    # --- Performance ---
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.1
    resolution: 0.05
    max_laser_range: 25.0 #RPLIDAR A3 max range
    minimum_laser_range: 0.5
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # --- Scan matching (still needed for localization) ---
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # --- Loop closure — disabled in pure localization ---
    loop_search_maximum_distance: 4.0
    do_loop_closing: false
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.30
    loop_match_minimum_response_fine: 0.45

    # --- Correlation search ---
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # --- Scan matcher penalties ---
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # --- Occupancy ---
    min_pass_through: 2
    occupancy_threshold: 0.1


# ==============================================================================
# AMCL — kept as fallback; not active when slam_toolbox provides map→odom TF
# ==============================================================================
amcl:
  ros__parameters:
    use_sim_time: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 25.0 #RPLIDAR A3 max range
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.10
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan


