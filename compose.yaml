
services:
  boeing-ros:
    build:
      context: .
      dockerfile: dockerfile

    image: boeing-navigation:humble
    container_name: boeing_ros

    network_mode: host
    ipc: host
    privileged: true

    volumes:
      # Mount source packages individually.
      - ./boeing_bringup:/ros_ws/src/boeing_bringup
      - ./boeing_description:/ros_ws/src/boeing_description
      - ./boeing_navigation:/ros_ws/src/boeing_navigation

      # Hardware access
      - /dev:/dev
      - /run/udev:/run/udev:ro

    working_dir: /ros_ws

    environment:
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: "0"

    stdin_open: true
    tty: true

    command: bash
