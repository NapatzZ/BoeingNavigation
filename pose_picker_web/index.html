<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pose Picker</title>
<style>
  :root { --bg:#1e1e24; --panel:#26262e; --line:#3a3a44; --accent:#2fbf5f;
          --text:#e6e6ea; --muted:#9a9aa6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, sans-serif;
               background:var(--bg); color:var(--text); }
  #app { display:flex; height:100vh; }
  #side { width:300px; flex:0 0 300px; background:var(--panel);
          border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #main { flex:1; position:relative; overflow:auto; background:#111; }
  h1 { font-size:15px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line);
       letter-spacing:.3px; }
  .block { padding:12px 16px; border-bottom:1px solid var(--line); }
  label { display:block; font-size:11px; color:var(--muted); margin:8px 0 3px; text-transform:uppercase;
          letter-spacing:.4px; }
  select, input, button { font:inherit; }
  select, input[type=text], input[type=number] {
    width:100%; padding:7px 8px; background:#1b1b20; color:var(--text);
    border:1px solid var(--line); border-radius:6px; }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  button { cursor:pointer; border:none; border-radius:6px; padding:8px 10px;
           background:#33333d; color:var(--text); }
  button.primary { background:var(--accent); color:#08240f; font-weight:600; }
  button.primary:hover { filter:brightness(1.08); }
  button:disabled { opacity:.4; cursor:default; }
  #list { flex:1; overflow:auto; }
  .item { display:flex; align-items:center; gap:8px; padding:7px 16px;
          border-bottom:1px solid #2c2c34; font-size:13px; cursor:pointer; }
  .item:hover { background:#2c2c36; }
  .item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .coord { color:var(--muted); font-size:11px; }
  .item .del { background:transparent; color:#e06a6a; padding:2px 6px; }
  #status { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.65);
            padding:6px 10px; border-radius:6px; font-size:12px; color:var(--muted);
            pointer-events:none; }
  #zoombar { position:absolute; right:10px; top:10px; background:rgba(0,0,0,.6);
             padding:6px 8px; border-radius:6px; display:flex; gap:6px; align-items:center; }
  #zoombar button { padding:2px 9px; }
  canvas { display:block; image-rendering:pixelated; cursor:crosshair; }
  .hint { font-size:12px; color:var(--muted); line-height:1.5; }
  .tag { display:inline-block; background:#0b3d1e; color:#7ee6a0; border-radius:4px;
         padding:0 6px; font-size:11px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Pose Picker</h1>

    <div class="block">
      <label>Map</label>
      <select id="mapSelect"></select>
      <p class="hint" style="margin:10px 0 0">
        Click the map to place a point. Hold and drag to aim the heading, then
        release. Fill the name and press <span class="tag">Save</span>.
      </p>
    </div>

    <div class="block" id="editor">
      <label>New / edit pose</label>
      <input id="poseName" type="text" placeholder="location name" />
      <div class="row" style="margin-top:8px">
        <div><label>X (m)</label><input id="poseX" type="number" step="0.001" /></div>
        <div><label>Y (m)</label><input id="poseY" type="number" step="0.001" /></div>
        <div><label>Yaw (°)</label><input id="poseYaw" type="number" step="1" /></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="saveBtn" style="flex:2">Save</button>
        <button id="clearBtn" style="flex:1">Clear</button>
      </div>
    </div>

    <label style="padding:10px 16px 0">Saved locations (<span id="count">0</span>)</label>
    <div id="list"></div>
  </div>

  <div id="main">
    <canvas id="canvas" width="10" height="10"></canvas>
    <div id="zoombar">
      <button id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn">+</button>
      <button id="zoomFit">fit</button>
    </div>
    <div id="status">no map</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');

let map = null;          // {name,resolution,origin,width,height}
let offscreen = null;    // native-resolution ImageBitmap-like canvas
let zoom = 1;
let poses = [];          // [{name,x,y,yaw,side}]
let selected = null;     // name of highlighted pose

// draft = the pose being created/edited (world coords + yaw radians)
let draft = null;        // {x,y,yaw}
let dragging = null;     // {sx,sy,cx,cy} in canvas px during drag

// ---- coordinate transforms ------------------------------------------------
// world <-> native pixel (row 0 = top of image)
function worldToNative(wx, wy) {
  const col = (wx - map.origin[0]) / map.resolution;
  const row = map.height - (wy - map.origin[1]) / map.resolution;
  return [col, row];
}
function nativeToWorld(col, row) {
  const wx = map.origin[0] + col * map.resolution;
  const wy = map.origin[1] + (map.height - row) * map.resolution;
  return [wx, wy];
}
// canvas px <-> native px
const canvasToNative = (cx, cy) => [cx / zoom, cy / zoom];
const nativeToCanvas = (col, row) => [col * zoom, row * zoom];

// ---- rendering ------------------------------------------------------------
function resizeCanvas() {
  if (!map) return;
  canvas.width = Math.max(1, Math.round(map.width * zoom));
  canvas.height = Math.max(1, Math.round(map.height * zoom));
  $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
  draw();
}

function drawArrow(cx, cy, yaw, color, label) {
  const L = 24, head = 8;
  const ex = cx + L * Math.cos(yaw);
  const ey = cy - L * Math.sin(yaw);   // canvas y is down; world +y is up
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
  // head
  const a = Math.atan2(ey - cy, ex - cx);
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - head * Math.cos(a - 0.4), ey - head * Math.sin(a - 0.4));
  ctx.lineTo(ex - head * Math.cos(a + 0.4), ey - head * Math.sin(a + 0.4));
  ctx.closePath(); ctx.fill();
  // dot at base
  ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 7); ctx.fill();
  if (label) {
    ctx.font = '12px system-ui';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(label, cx + 7, cy - 7);
    ctx.fillStyle = '#fff'; ctx.fillText(label, cx + 7, cy - 7);
  }
}

function draw() {
  if (!map || !offscreen) return;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(offscreen, 0, 0, canvas.width, canvas.height);

  // saved poses
  for (const p of poses) {
    const [col, row] = worldToNative(p.x, p.y);
    const [cx, cy] = nativeToCanvas(col, row);
    const color = (p.name === selected) ? '#ffd23f' : '#2fbf5f';
    drawArrow(cx, cy, p.yaw, color, p.name);
  }

  // draft (in-progress or being edited)
  if (draft) {
    const [col, row] = worldToNative(draft.x, draft.y);
    const [cx, cy] = nativeToCanvas(col, row);
    drawArrow(cx, cy, draft.yaw, '#4aa8ff', $('poseName').value || '(new)');
  }
}

// ---- interaction ----------------------------------------------------------
function setDraftFromCanvas(sx, sy, yaw) {
  const [col, row] = canvasToNative(sx, sy);
  const [wx, wy] = nativeToWorld(col, row);
  draft = { x: wx, y: wy, yaw: yaw };
  $('poseX').value = wx.toFixed(3);
  $('poseY').value = wy.toFixed(3);
  $('poseYaw').value = (yaw * 180 / Math.PI).toFixed(1);
}

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || !map) return;
  dragging = { sx: e.offsetX, sy: e.offsetY, cx: e.offsetX, cy: e.offsetY };
});

canvas.addEventListener('mousemove', (e) => {
  if (map) {
    const [col, row] = canvasToNative(e.offsetX, e.offsetY);
    const [wx, wy] = nativeToWorld(col, row);
    $('status').textContent =
      `x ${wx.toFixed(3)}  y ${wy.toFixed(3)}   (px ${Math.round(col)}, ${Math.round(row)})`;
  }
  if (dragging) {
    dragging.cx = e.offsetX; dragging.cy = e.offsetY;
    const yaw = Math.atan2(-(dragging.cy - dragging.sy), dragging.cx - dragging.sx);
    setDraftFromCanvas(dragging.sx, dragging.sy,
      (dragging.cx === dragging.sx && dragging.cy === dragging.sy) ? currentYaw() : yaw);
    draw();
  }
});

window.addEventListener('mouseup', (e) => {
  if (!dragging) return;
  const moved = Math.hypot(dragging.cx - dragging.sx, dragging.cy - dragging.sy);
  const yaw = moved < 4 ? currentYaw()
            : Math.atan2(-(dragging.cy - dragging.sy), dragging.cx - dragging.sx);
  setDraftFromCanvas(dragging.sx, dragging.sy, yaw);
  dragging = null;
  draw();
  $('poseName').focus();
});

function currentYaw() {
  const v = parseFloat($('poseYaw').value);
  return isNaN(v) ? 0 : v * Math.PI / 180;
}

// editor fields -> draft
for (const id of ['poseX', 'poseY', 'poseYaw']) {
  $(id).addEventListener('input', () => {
    const x = parseFloat($('poseX').value);
    const y = parseFloat($('poseY').value);
    if (isNaN(x) || isNaN(y)) return;
    draft = { x, y, yaw: currentYaw() };
    draw();
  });
}
$('poseName').addEventListener('input', draw);

$('clearBtn').addEventListener('click', () => {
  draft = null; selected = null;
  $('poseName').value = ''; $('poseX').value = ''; $('poseY').value = ''; $('poseYaw').value = '';
  draw();
});

$('saveBtn').addEventListener('click', async () => {
  const name = $('poseName').value.trim();
  const x = parseFloat($('poseX').value);
  const y = parseFloat($('poseY').value);
  const yaw = currentYaw();
  if (!name) { alert('Enter a name.'); $('poseName').focus(); return; }
  if (isNaN(x) || isNaN(y)) { alert('Click the map or enter X/Y.'); return; }
  const res = await fetch('/api/poses', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, x, y, yaw }),
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  poses = data.poses; selected = name; draft = null;
  renderList(); draw();
});

// ---- list -----------------------------------------------------------------
function renderList() {
  poses.sort((a, b) => a.name.localeCompare(b.name));
  $('count').textContent = poses.length;
  const list = $('list');
  list.innerHTML = '';
  for (const p of poses) {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML =
      `<div class="name">${escapeHtml(p.name)}<div class="coord">` +
      `${p.x.toFixed(2)}, ${p.y.toFixed(2)} · ${(p.yaw * 180 / Math.PI).toFixed(0)}°</div></div>`;
    div.addEventListener('click', () => { editPose(p); });
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕';
    del.addEventListener('click', (e) => { e.stopPropagation(); deletePose(p.name); });
    div.appendChild(del);
    list.appendChild(div);
  }
}

function editPose(p) {
  selected = p.name;
  draft = { x: p.x, y: p.y, yaw: p.yaw };
  $('poseName').value = p.name;
  $('poseX').value = p.x.toFixed(3);
  $('poseY').value = p.y.toFixed(3);
  $('poseYaw').value = (p.yaw * 180 / Math.PI).toFixed(1);
  draw();
}

async function deletePose(name) {
  if (!confirm(`Delete "${name}"?`)) return;
  const res = await fetch('/api/poses/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  const data = await res.json();
  poses = data.poses;
  if (selected === name) { selected = null; }
  renderList(); draw();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;' }[c]));
}

// ---- data loading ---------------------------------------------------------
async function loadPoses() {
  const data = await (await fetch('/api/poses')).json();
  poses = data.poses;
  renderList();
}

async function loadMap(name) {
  const meta = await (await fetch('/api/map?name=' + encodeURIComponent(name))).json();
  if (meta.error) { alert(meta.error); return; }
  map = meta;
  const md = await (await fetch('/api/mapdata?name=' + encodeURIComponent(name))).json();
  // build native-resolution offscreen canvas from grayscale bytes
  const bin = atob(md.pixels);
  const img = new ImageData(md.width, md.height);
  for (let i = 0; i < bin.length; i++) {
    const v = bin.charCodeAt(i), j = i * 4;
    img.data[j] = v; img.data[j + 1] = v; img.data[j + 2] = v; img.data[j + 3] = 255;
  }
  offscreen = document.createElement('canvas');
  offscreen.width = md.width; offscreen.height = md.height;
  offscreen.getContext('2d').putImageData(img, 0, 0);
  fitZoom();
}

function fitZoom() {
  const mainW = $('main').clientWidth - 20;
  const mainH = $('main').clientHeight - 20;
  zoom = Math.min(mainW / map.width, mainH / map.height);
  if (!isFinite(zoom) || zoom <= 0) zoom = 1;
  resizeCanvas();
}

$('zoomIn').addEventListener('click', () => { zoom *= 1.25; resizeCanvas(); });
$('zoomOut').addEventListener('click', () => { zoom /= 1.25; resizeCanvas(); });
$('zoomFit').addEventListener('click', fitZoom);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoom *= e.deltaY < 0 ? 1.1 : 1 / 1.1;
  resizeCanvas();
}, { passive: false });

$('mapSelect').addEventListener('change', (e) => loadMap(e.target.value));

// ---- init -----------------------------------------------------------------
(async function init() {
  const { maps } = await (await fetch('/api/maps')).json();
  const sel = $('mapSelect');
  for (const m of maps) {
    const o = document.createElement('option');
    o.value = m; o.textContent = m; sel.appendChild(o);
  }
  await loadPoses();
  if (maps.length) { sel.value = maps[0]; await loadMap(maps[0]); }
})();
</script>
</body>
</html>
